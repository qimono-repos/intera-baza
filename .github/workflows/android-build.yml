name: Build and Sign Android APK

on:
  push:
    branches: [ trunk ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            jq \
            libicu-dev \
            zlib1g \
            libssl-dev

      - name: Remove Existing .NET SDK (DANGEROUS!)
        run: |
          sudo rm -rf /usr/lib/dotnet/sdk/*  # THIS IS POTENTIALLY DESTRUCTIVE!
          sudo rm -rf /usr/lib/dotnet/shared/*

      - name: Download .NET SDK (Direct) and Extract to System
        env:
          DOTNET_VERSION: 9.0.200
          DOTNET_INSTALL_DIR: /usr/lib/dotnet  # Install to system directory
          DOTNET_DOWNLOAD_URL: https://builds.dotnet.microsoft.com/dotnet/Sdk/9.0.200/dotnet-sdk-9.0.200-linux-x64.tar.gz
        run: |
          echo "Downloading .NET SDK $DOTNET_VERSION from $DOTNET_DOWNLOAD_URL"
          sudo mkdir -p $DOTNET_INSTALL_DIR
          curl -sSL $DOTNET_DOWNLOAD_URL -o dotnet-sdk.tar.gz
          sudo tar zxf dotnet-sdk.tar.gz -C $DOTNET_INSTALL_DIR

          echo "Setting Environment Variables"
          echo "DOTNET_ROOT=$DOTNET_INSTALL_DIR" >> $GITHUB_ENV
          echo "PATH=$DOTNET_INSTALL_DIR:$PATH" >> $GITHUB_ENV  # Prepend to PATH

          echo "Verifying .NET SDK installation"
          sudo dotnet --info

      - name: Install MAUI workload
        run: sudo dotnet workload install maui

      - name: Verify MAUI workload Installation
        run: sudo dotnet workload list

      - name: Restore NuGet packages
        run: sudo dotnet restore Demo.csproj

      - name: Decode and store keystore file
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > qi-release-key.keystore
        working-directory: ${{ github.workspace }}

      - name: Build Android Release
        run: sudo dotnet publish Demo.csproj -c Release /p:AndroidKeyStore=true /p:AndroidSigningKeyStore=$GITHUB_WORKSPACE/qi-release-key.keystore /p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} /p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }} /p:AndroidSigningStorePass=${{ secrets.ANDROID_STORE_PASSWORD }} /p:EnableTrimmer=false

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Android-APK
          path: Demo/bin/Release/net9.0-android/publish/*.apk

